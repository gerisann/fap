<!doctype html>
<html lang="hu">
<head>
<title>FAP – Fun Map</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css">
<style>
/* Layout: the map is the page. One soft white card (top-left), one ink pill action (bottom-centre), one sheet. No rules, no outlines; separation by space and shadow. */
:root{
  --ink:#16181c;
  --paper:#ffffff;
  --cobalt:#3355ff;
  --mute:#8b9099;
  --wash:color-mix(in srgb,var(--mute) 12%,var(--paper));
  --wash-2:color-mix(in srgb,var(--mute) 22%,var(--paper));
  --cobalt-soft:color-mix(in srgb,var(--cobalt) 10%,var(--paper));
  --shadow:0 1px 2px rgba(22,24,28,.06),0 14px 44px -12px rgba(22,24,28,.22);
  --r-lg:26px; --r-md:16px; --r-sm:11px;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --ctrl-filter:none;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eceef1;--paper:#1b1d21;--cobalt:#6680ff;--mute:#7c828b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 48px -12px rgba(0,0,0,.6);--ctrl-filter:invert(.88) hue-rotate(180deg);color-scheme:dark;}}
:root[data-theme="dark"]{--ink:#eceef1;--paper:#1b1d21;--cobalt:#6680ff;--mute:#7c828b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 48px -12px rgba(0,0,0,.6);--ctrl-filter:invert(.88) hue-rotate(180deg);color-scheme:dark;}
html,body{height:100%}
body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
#map{position:fixed;inset:0;z-index:0;isolation:isolate}

/* map chrome */
.mapboxgl-ctrl-group,.mapboxgl-ctrl-group{filter:var(--ctrl-filter);border-radius:var(--r-sm)!important;box-shadow:var(--shadow)!important;overflow:hidden}
.mapboxgl-ctrl-group button+button,.mapboxgl-ctrl-group button+button{border-top:0!important}
.mapboxgl-ctrl-bottom-right,.mapboxgl-ctrl-bottom-right{margin-right:calc(6px + env(safe-area-inset-right,0px));margin-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.mapboxgl-ctrl-attrib,.mapboxgl-ctrl-attrib{background:color-mix(in srgb,var(--paper) 70%,transparent)!important;color:var(--mute)!important;border-radius:var(--r-sm)!important}
.mapboxgl-ctrl-attrib a,.mapboxgl-ctrl-attrib a{color:var(--mute)!important}
.mapboxgl-popup-content,.mapboxgl-popup-content{background:var(--paper);color:var(--ink);border-radius:var(--r-sm);padding:10px 14px;box-shadow:var(--shadow);font:500 13px/1.35 var(--f-body)}
.mapboxgl-popup-tip,.mapboxgl-popup-tip{display:none}
.pop-t{display:flex;gap:8px;align-items:center;font-weight:600}
.pop-s{color:var(--mute);font-size:12px;margin-top:3px}

/* card */
.board{position:fixed;z-index:5;top:calc(18px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));width:300px;
  max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.board-head{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 22px 0}
.logo{font:800 30px/.8 var(--f-display);letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--cobalt)}
.score{text-align:right;line-height:1.15}
.score b{display:block;font:600 19px/1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--mute)}
.board-body{display:flex;flex-direction:column;gap:18px;padding:20px 14px 18px;overflow:auto;min-height:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--wash);border-radius:999px;padding:4px;margin:0 8px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 0;font-weight:500;color:var(--mute);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(22,24,28,.12)}
#filterBox{margin:0 8px}
#filterBox:empty{display:none}
.filter-chip{display:flex;align-items:center;gap:10px;background:var(--cobalt-soft);border-radius:999px;padding:6px 6px 6px 14px;font-weight:600}
.filter-chip button{border:0;background:var(--paper);border-radius:50%;width:26px;height:26px;font-size:12px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.teams{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.teams li button{width:100%;display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:12px;border:0;background:transparent;padding:9px 10px;border-radius:var(--r-sm);text-align:left;font-weight:500}
.teams li button:hover{background:var(--wash)}
.teams li button[aria-pressed="true"]{background:var(--cobalt-soft)}
.teams .n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.teams li button[aria-pressed="true"] .n{color:var(--cobalt)}
.teams .bar{display:none}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 8px}
.switch{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;cursor:pointer}
.switch input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--wash-2);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:transform .15s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(12px)}
.themebtn{border:0;background:var(--wash);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.themebtn svg{width:16px;height:16px}
.themebtn .moon{display:none}
.is-dark .themebtn .sun{display:none}
.is-dark .themebtn .moon{display:block}
.foot-r{display:flex;align-items:center;gap:12px}
#modeNote{margin:0;font-size:12px;color:var(--mute);text-align:right}
details.more{display:contents}
details.more summary{display:none}

/* primary action */
.cta{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:999px;background:var(--ink);color:var(--paper);padding:16px 26px 16px 22px;font-weight:600;font-size:15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;white-space:nowrap}
.cta::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cobalt);box-shadow:0 0 0 4px color-mix(in srgb,var(--cobalt) 35%,transparent)}
body.sheet-open .cta{display:none}

/* sheet */
.sheet{position:fixed;z-index:6;top:calc(18px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));width:340px;
  max-height:calc(100% - 36px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:24px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:0;font:800 26px/1 var(--f-display);letter-spacing:-.035em}
.x{border:0;background:var(--wash);width:34px;height:34px;border-radius:50%;color:var(--mute);font-size:14px}
.step{display:flex;flex-direction:column;gap:8px}
.step .label{font-size:12px;color:var(--mute);font-weight:500;padding-left:4px}
.step .label i{display:none}
.field{width:100%;box-sizing:border-box;border:0;background:var(--wash);border-radius:var(--r-md);padding:14px 16px;font-size:15px;font-weight:500}
.field::placeholder{color:var(--mute)}
.combo{position:relative}
.combo ul{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:3;list-style:none;margin:0;padding:6px;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);max-height:240px;overflow:auto}
.combo li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer}
.combo li[aria-selected="true"],.combo li:hover{background:var(--wash)}
.combo li small{margin-left:auto;color:var(--mute);font-size:11px}
.loc{display:grid;grid-template-columns:auto 1fr;gap:8px}
.chipbtn{border:0;background:var(--ink);color:var(--paper);border-radius:var(--r-md);padding:0 16px;font-weight:600;font-size:14px}
.loc select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.picked{font-size:12px;color:var(--mute);padding-left:4px;min-height:1.2em}
.picked.on{color:var(--ink)}
.prec{display:grid;grid-template-columns:repeat(3,1fr);background:var(--wash);border-radius:999px;padding:4px}
.prec label{display:block;text-align:center;padding:10px 0;border-radius:999px;cursor:pointer;font-weight:500;color:var(--mute);transition:background .15s,color .15s}
.prec label:has(input:checked){background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(22,24,28,.12)}
.prec label:has(input:focus-visible){outline:2px solid var(--cobalt)}
.prec input{position:absolute;opacity:0;pointer-events:none}
.prec span,.prec b{font:inherit}
.hint{font-size:12px;color:var(--mute);padding-left:4px}
.save{border:0;border-radius:999px;background:var(--cobalt);color:var(--paper);padding:16px;font-weight:600;font-size:15px}
.save:disabled{background:var(--wash-2);color:var(--mute);cursor:not-allowed}
.actions{display:flex;flex-direction:column;gap:10px}
.textbtn{border:0;background:transparent;color:var(--mute);font-size:13px;padding:6px;align-self:center}
.status{font-size:13px;color:var(--ink);text-align:center;min-height:0}
.status:empty{display:none}
.status.err{color:var(--cobalt)}

.pickhint{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font-weight:600;padding:15px 22px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}

/* markers */
.donut{display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 3px 8px rgba(22,24,28,.18))}
.donut svg{position:absolute;inset:0}
.donut b{position:relative;font:600 12px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink)}
.cl{font:600 12px/1 var(--f-body);font-variant-numeric:tabular-nums;pointer-events:none;color:#fff}
.cl.dark{color:#16181c}
.city{font:500 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);pointer-events:none;white-space:nowrap;transform:translateY(14px)}
#map.lowzoom .city{display:none}
.me{width:16px;height:16px;border-radius:50%;background:var(--cobalt);border:3px solid var(--paper);box-shadow:0 0 0 6px color-mix(in srgb,var(--cobalt) 25%,transparent),var(--shadow)}
.me.pending{background:var(--ink);cursor:grab}

@media (max-width:720px){
  .board{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));width:auto;border-radius:22px;max-height:none}
  .board-head{padding:16px 18px 0}
  .logo{font-size:26px}
  .board-body{padding:14px 10px 12px;gap:12px;overflow:visible}
  .seg{margin:0 6px}
  #filterBox{margin:0 6px}
  .teams{flex-direction:row;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 6px;margin:0 -10px;padding-left:16px;padding-right:16px}
  .teams::-webkit-scrollbar{display:none}
  .teams li{flex:none}
  .teams li button{display:flex;gap:8px;background:var(--wash);border-radius:999px;padding:8px 12px;font-size:13px}
  .teams .n{font-size:12px}
  .foot{margin:0 6px}
  body.sheet-open .board{display:none}
  .sheet{top:auto;bottom:0;left:0;right:0;width:auto;max-height:82%;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));gap:20px}
  .cta{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Szurkolói térkép"></div>

<section class="board" aria-label="FAP">
  <header class="board-head">
    <div class="logo">fap<i>.</i></div>
    <div class="score"><b id="sTotal">–</b><span id="sTeams">csapat</span></div>
  </header>
  <div class="board-body">
    <div class="seg" role="group" aria-label="Nézet">
      <button id="vPins" aria-pressed="true">Pinek</button>
      <button id="vHeat" aria-pressed="false">Heatmap</button>
    </div>
    <div id="filterBox"></div>
    <details class="more" id="teamsWrap" open><summary>Csapatok</summary>
      <ul class="teams" id="teamList"></ul>
    </details>
    <div class="foot">
      <label class="switch"><input type="checkbox" id="demoToggle" checked> Demó</label>
      <div class="foot-r"><p id="modeNote"></p><button class="themebtn" id="themeBtn" aria-label="Világos / sötét mód"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
    </div>
  </div>
</section>

<button class="cta" id="openSheet">Bejelölöm magam</button>

<aside class="sheet" id="sheet" hidden aria-label="Bejelölés">
  <div class="sheet-head"><h2>Hol szurkolsz?</h2><button class="x" id="closeSheet" aria-label="Bezárás">✕</button></div>
  <div class="step" id="st1">
    <div class="label"><i>1</i>Csapat</div>
    <div class="combo">
      <input class="field" id="teamInput" placeholder="Arsenal, Fradi, Boca…" autocomplete="off" maxlength="40" role="combobox" aria-expanded="false" aria-controls="teamOpts">
      <ul id="teamOpts" role="listbox" hidden></ul>
    </div>
  </div>
  <div class="step" id="st2">
    <div class="label"><i>2</i>Hely</div>
    <div class="loc">
      <button class="chipbtn" id="pickBtn">Térképen</button>
      <select class="field" id="citySel" aria-label="Város"><option value="">vagy válassz várost</option></select>
    </div>
    <div class="picked" id="pickedBox"></div>
  </div>
  <div class="step" id="st3">
    <div class="label"><i>3</i>Pontosság</div>
    <div class="prec" role="radiogroup" aria-label="Pontosság">
      <label><input type="radio" name="prec" value="area" id="pArea" checked><b>Környék</b></label>
      <label><input type="radio" name="prec" value="city" id="pCity"><b>Város</b></label>
      <label><input type="radio" name="prec" value="exact" id="pExact"><b>Pontos</b></label>
    </div>
    <div class="hint" id="precHint">±500 m-rel elmosva</div>
  </div>
  <div class="actions">
    <button class="save" id="saveBtn" disabled>Felrakom</button>
    <div id="myRow" hidden style="display:flex;justify-content:center"><button class="textbtn" id="delBtn">Pinem törlése</button></div>
    <div class="status" id="status" role="status"></div>
  </div>
</aside>

<div class="pickhint" id="pickHint" hidden>Koppints oda, ahol szurkolsz</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  const arr=filter?pts.filter(p=>p.t===filter):[];
  const col=filter?colorOf(filter):"#000";
  addClusterSource("one",fc(arr));map.setPaintProperty("one-c","circle-color",col);
}
function applyVisibility(){
  const all=view==="pins"&&!filter, one=view==="pins"&&!!filter;
  for(const [id,on] of [["all",all],["one",one]])for(const L of ["-c","-u"])if(map.getLayer(id+L))map.setLayoutProperty(id+L,"visibility",on?"visible":"none");
  map.setLayoutProperty("heatL","visibility",view==="heat"?"visible":"none");
  map.setFilter("heatL",filter?["==",["get","t"],filter]:null);
  clearLabels();scheduleLabels();
}
async function onClick(e,src){
  if(picking)return;
  const f=e.features[0];
  if(f.properties.point_count){zoomCluster(src,f.properties.cluster_id,f.geometry.coordinates);return;}
  const t=f.properties.t;
  const pl={exact:"pontos hely",area:"környék (±600 m)",city:"város szint"}[f.properties.p]||"";
  const el=document.createElement("div");
  const a=document.createElement("div");a.className="pop-t";const d=document.createElement("span");d.className="dot";d.style.background=colorOf(t);a.append(d,document.createTextNode(t+" szurkoló"));
  const b=document.createElement("div");b.className="pop-s";b.textContent=pl+(f.properties.d?" · demó":" · valódi bejelölés");
  el.append(a,b);
  new mapboxgl.Popup({offset:10,closeButton:false}).setLngLat(f.geometry.coordinates).setDOMContent(el).addTo(map);
}
async function zoomCluster(src,id,center){
  map.getSource(src).getClusterExpansionZoom(id,(err,z)=>{if(err||z==null)return;map.easeTo({center,zoom:Math.min(z+0.2,19)});});
}
for(const src of ["all","one"])for(const L of ["-c","-u"]){
  map.on("click",src+L,e=>onClick(e,src));
  map.on("mouseenter",src+L,()=>{if(!picking)map.getCanvas().style.cursor="pointer";});
  map.on("mouseleave",src+L,()=>{if(!picking)map.getCanvas().style.cursor="";});
}

/* cluster markers drawn as HTML: team-share donuts (all) or numbered team bubbles (one) */
let labels=new Map(),labelTimer=0;
function scheduleLabels(){if(labelTimer)return;labelTimer=setTimeout(()=>{labelTimer=0;updateLabels();},60);}
function clearLabels(){for(const m of labels.values())m.remove();labels=new Map();}
function fmt(n){return n>=10000?Math.round(n/1000)+"k":n>=1000?(n/1000).toFixed(1).replace(".0","")+"k":String(n);}
function radiusFor(n){return n<10?12:n<50?15:n<200?19:n<1000?24:n<4000?30:37;}
function donut(props){
  const n=props.point_count,r=radiusFor(n)+3,w=Math.max(4,r*.22),R=r-w/2,C=2*Math.PI*R;
  const parts=topKeys.map((t,i)=>[colorOf(t),props["k"+i]||0]);
  const known=parts.reduce((s,x)=>s+x[1],0);parts.push([OTHER,Math.max(0,n-known)]);
  let off=0,segs="";
  for(const [col,v] of parts){if(!v)continue;const len=v/n*C;segs+=`<circle r="${R}" cx="${r}" cy="${r}" fill="none" style="stroke:${col}" stroke-width="${w}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${r} ${r})"/>`;off+=len;}
  const el=document.createElement("div");el.className="donut";el.style.width=el.style.height=(2*r)+"px";
  el.innerHTML=`<svg width="${2*r}" height="${2*r}" viewBox="0 0 ${2*r} ${2*r}" aria-hidden="true"><circle r="${r-.5}" cx="${r}" cy="${r}" style="fill:var(--paper)"/>${segs}</svg><b>${fmt(n)}</b>`;
  const lead=parts.slice(0,-1).sort((a,b)=>b[1]-a[1])[0];
  el.title=n+" szurkoló"+(lead&&lead[1]?" · legtöbb: "+topKeys[parts.findIndex(p=>p===lead)]:"");
  return el;
}
function updateLabels(){
  if(!ready)return;
  const next=new Map();
  const src=view!=="pins"?null:filter?"one":"all";
  if(src){
    let feats=[];try{feats=map.querySourceFeatures(src,{filter:["has","point_count"]});}catch(_){}
    for(const f of feats){
      const key=src+":"+f.properties.cluster_id;if(next.has(key))continue;
      let m=labels.get(key);
      if(!m){
        let el;
        if(src==="all"){el=donut(f.properties);el.addEventListener("click",ev=>{ev.stopPropagation();if(!picking)zoomCluster("all",f.properties.cluster_id,f.geometry.coordinates);});}
        else{el=document.createElement("div");el.className="cl"+(light(filter)?" dark":"");el.textContent=fmt(f.properties.point_count);}
        m=new mapboxgl.Marker({element:el}).setLngLat(f.geometry.coordinates).addTo(map);
      }
      next.set(key,m);
    }
  }
  for(const [k,m] of labels)if(!next.has(k))m.remove();
  labels=next;
}
map.on("moveend",scheduleLabels);
map.on("idle",scheduleLabels);
map.on("sourcedata",e=>{if(e.isSourceLoaded&&(e.sourceId==="all"||e.sourceId==="one"))scheduleLabels();});
map.on("zoomend",()=>{clearLabels();scheduleLabels();});

function setupLayers(){
  if(map.getSource("heat"))return;
  map.addSource("heat",{type:"geojson",data:fc([])});
  map.addLayer({id:"heatL",type:"heatmap",source:"heat",layout:{visibility:"none"},paint:{
    "heatmap-weight":["interpolate",["linear"],["zoom"],1,.01,5,.04,9,.2,13,1],
    "heatmap-intensity":1,
    "heatmap-radius":["interpolate",["linear"],["zoom"],1,10,5,22,10,30,14,36],
    "heatmap-opacity":.85,
    "heatmap-color":heatRamp()}});
  ready=true;topKeys=[];rebuild();applyMapTheme();
}
map.on("load",setupLayers);
$("#themeBtn").onclick=()=>applyTheme(theme==="dark"?"light":"dark",true);
onThemeMap=()=>{const want=P().style;if(want!==curStyle){curStyle=want;ready=false;clearLabels();map.setStyle(want,{diff:false});}else if(ready)applyMapTheme();};
applyTheme(theme,false);

/* ---------- board ---------- */
let lastGroups=null,lastTotal=0;
function renderStats(groups,total){lastGroups=groups;lastTotal=total;
  $("#sTotal").textContent=total.toLocaleString("hu-HU");
  $("#sTeams").textContent="szurkoló · "+groups.size+" csapat";
  const top=[...groups.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=top[0]?top[0][1]:1;const ul=$("#teamList");ul.replaceChildren();
  for(const [t,n] of top){
    const li=document.createElement("li"),b=document.createElement("button");b.setAttribute("aria-pressed",String(filter===t));
    const d=document.createElement("span");d.className="dot";d.style.background=colorOf(t);
    const nm=document.createElement("span");nm.textContent=t;const c=document.createElement("span");c.className="n";c.textContent=n.toLocaleString("hu-HU");
    const bar=document.createElement("span");bar.className="bar";const bi=document.createElement("i");bi.style.width=(n/max*100)+"%";bi.style.background=colorOf(t);bar.append(bi);
    b.append(d,nm,c,bar);b.onclick=()=>setFilter(filter===t?null:t);li.append(b);ul.append(li);
  }
  renderFilter();
}
function renderFilter(){
  const box=$("#filterBox");box.replaceChildren();
  if(!filter)return;
  const chip=document.createElement("div");chip.className="filter-chip";const d=document.createElement("span");d.className="dot";d.style.background=colorOf(filter);
  const n=document.createElement("span");n.textContent=filter;n.style.flex="1";const x=document.createElement("button");x.textContent="✕";x.setAttribute("aria-label","Szűrő törlése");x.onclick=()=>setFilter(null);
  chip.append(d,n,x);box.append(chip);
}
function setFilter(t){filter=t;updateOne();applyVisibility();if(lastGroups)renderStats(lastGroups,lastTotal);}
function setView(v){view=v;$("#vPins").setAttribute("aria-pressed",String(v==="pins"));$("#vHeat").setAttribute("aria-pressed",String(v==="heat"));applyVisibility();}
$("#vPins").onclick=()=>setView("pins");$("#vHeat").onclick=()=>setView("heat");
$("#demoToggle").onchange=e=>{showDemo=e.target.checked;rebuild();};

/* ---------- sign-up sheet ---------- */
let chosenTeam=null, pickLL=null, picking=false, pendingMarker=null, myMarker=null;
const sheet=$("#sheet");
$("#openSheet").onclick=()=>{sheet.hidden=false;document.body.classList.add("sheet-open");$("#teamInput").focus();};
$("#closeSheet").onclick=()=>{sheet.hidden=true;document.body.classList.remove("sheet-open");stopPick();};
for(const c of [...CITIES].sort((a,b)=>a[0].localeCompare(b[0],"hu"))){const o=document.createElement("option");o.value=c[1]+","+c[2];o.textContent=c[0];$("#citySel").append(o);}

const ti=$("#teamInput"),opts=$("#teamOpts");let optIdx=0,optList=[];
function showOpts(){
  const q=ti.value.trim().toLowerCase();
  if(!q){opts.hidden=true;ti.setAttribute("aria-expanded","false");return;}
  const al=aliases[q];
  optList=TEAMS.filter(([n])=>n.toLowerCase().includes(q)||(al&&n===al)).slice(0,8).map(x=>x[0]);
  const exact=optList.some(n=>n.toLowerCase()===q);
  if(!exact)optList.push({custom:ti.value.trim().slice(0,40)});
  optIdx=0;opts.replaceChildren();
  optList.forEach((o,i)=>{const li=document.createElement("li");li.setAttribute("role","option");li.setAttribute("aria-selected",String(i===optIdx));
    const name=typeof o==="string"?o:o.custom;const d=document.createElement("span");d.className="dot";d.style.background=colorOf(name);
    const s=document.createElement("span");s.textContent=typeof o==="string"?o:`Új csapat: „${o.custom}”`;const sm=document.createElement("small");sm.textContent=typeof o==="string"?(teamMeta.get(o.toLowerCase()).country==="NAT"?"VÁLOGATOTT":teamMeta.get(o.toLowerCase()).country):"SAJÁT";
    li.append(d,s,sm);li.onmousedown=ev=>{ev.preventDefault();pickTeam(name);};opts.append(li);});
  opts.hidden=false;ti.setAttribute("aria-expanded","true");
}
function pickTeam(name){chosenTeam=canonical(name);ti.value=chosenTeam;opts.hidden=true;ti.setAttribute("aria-expanded","false");$("#st1").classList.add("done");validate();}
ti.addEventListener("input",()=>{chosenTeam=null;$("#st1").classList.remove("done");showOpts();validate();});
ti.addEventListener("keydown",e=>{
  if(opts.hidden)return;const items=[...opts.children];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();optIdx=(optIdx+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((li,i)=>li.setAttribute("aria-selected",String(i===optIdx)));}
  else if(e.key==="Enter"){e.preventDefault();const o=optList[optIdx];pickTeam(typeof o==="string"?o:o.custom);}
  else if(e.key==="Escape"){opts.hidden=true;}
});
ti.addEventListener("blur",()=>{setTimeout(()=>{opts.hidden=true;},120);});

function setPick(lng,lat,label){
  pickLL=[lat,lng];
  if(!pendingMarker){const el=document.createElement("div");el.className="me pending";pendingMarker=new mapboxgl.Marker({element:el,draggable:true}).setLngLat([lng,lat]).addTo(map);
    pendingMarker.on("dragend",()=>{const p=pendingMarker.getLngLat();setPick(p.lng,p.lat);});}
  else pendingMarker.setLngLat([lng,lat]);
  const b=$("#pickedBox");b.classList.add("on");b.textContent=(label?label+" · ":"")+lat.toFixed(3)+", "+lng.toFixed(3);
  $("#st2").classList.add("done");validate();
}
function startPick(){picking=true;$("#pickHint").hidden=false;map.getCanvas().style.cursor="crosshair";if(innerWidth<=720)sheet.hidden=true;}
function stopPick(){picking=false;$("#pickHint").hidden=true;map.getCanvas().style.cursor="";}
$("#pickBtn").onclick=startPick;
map.on("click",e=>{if(!picking)return;setPick(e.lngLat.lng,e.lngLat.lat);stopPick();sheet.hidden=false;});
$("#citySel").onchange=e=>{if(!e.target.value)return;const [la,ln]=e.target.value.split(",").map(Number);setPick(ln,la,e.target.selectedOptions[0].textContent);map.flyTo({center:[ln,la],zoom:11});};
const HINTS={area:"±500 m-rel elmosva",city:"5 km-es rácsra igazítva",exact:"Pontosan ott, ahová jelölöd"};
document.querySelectorAll('input[name="prec"]').forEach(r=>r.addEventListener("change",()=>{$("#precHint").textContent=HINTS[r.value];}));
function validate(){$("#saveBtn").disabled=!(chosenTeam&&pickLL);}
function setStatus(msg,err){const s=$("#status");s.textContent=msg;s.classList.toggle("err",!!err);}

function showMine(p){
  if(myMarker){myMarker.remove();myMarker=null;}
  $("#myRow").hidden=!p;
  if(!p)return;
  const el=document.createElement("div");el.className="me";el.title="Te ("+p.t+")";
  myMarker=new mapboxgl.Marker({element:el}).setLngLat([p.lng,p.lat]).addTo(map);
}
$("#saveBtn").onclick=async()=>{
  const prec=document.querySelector('input[name="prec"]:checked').value;
  const [bl,bg]=blur(pickLL[0],pickLL[1],prec);
  const pin={t:chosenTeam,lat:+bl.toFixed(6),lng:+bg.toFixed(6),p:prec,ts:Date.now()};
  $("#saveBtn").disabled=true;
  if(pendingMarker){pendingMarker.remove();pendingMarker=null;}
  if(db&&uid){
    try{await db.collection("pins").doc(uid).set(pin);myPin=pin;setStatus("Fent vagy.");}
    catch(e){localOnly={...pin,demo:false};myPin=localOnly;setStatus("Nem sikerült menteni, csak nálad látszik.",true);rebuild();}
  } else {localOnly={...pin,demo:false};myPin=localOnly;try{localStorage.setItem(LS,JSON.stringify(pin));}catch(_){}setStatus("Fent vagy (csak ezen az eszközön).");rebuild();}
  showMine(myPin);map.flyTo({center:[pin.lng,pin.lat],zoom:Math.max(map.getZoom(),12)});validate();
};
$("#delBtn").onclick=async()=>{
  if(db&&uid&&!localOnly){try{await db.collection("pins").doc(uid).delete();}catch(_){setStatus("Nem sikerült törölni, próbáld újra.",true);return;}}
  localOnly=null;myPin=null;try{localStorage.removeItem(LS);}catch(_){}showMine(null);rebuild();setStatus("Törölve.");
};

/* ---------- shared store ---------- */
function clean(d){
  if(!d||typeof d.t!=="string")return null;const t=d.t.trim().slice(0,40);if(!t)return null;
  const lat=+d.lat,lng=+d.lng;if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>85||Math.abs(lng)>180)return null;
  return {t:canonical(t),lat,lng,p:["exact","area","city"].includes(d.p)?d.p:"area",demo:false};
}
(async()=>{
  const use=window.claude&&window.claude.use;
  if(!use){$("#modeNote").textContent="";if(localOnly){myPin=localOnly;map.once("load",()=>showMine(localOnly));}return;}
  const [dbNs,userNs]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  db=dbNs;if(!db){$("#modeNote").textContent="Csak helyi";return;}
  try{uid=userNs?await userNs.id():null;}catch(_){uid=null;}
  if(!uid){db=null;$("#modeNote").textContent="Csak helyi";return;}
  const timer=setTimeout(()=>{$("#modeNote").textContent="Kapcsolódás…";},10000);
  db.collection("pins").onSnapshot(snap=>{
    if(!snap.metadata.fromCache)clearTimeout(timer);
    const m=new Map();for(const d of snap.docs){const p=clean(d.data());if(p)m.set(d.id,p);}
    real=m;const mine=m.get(uid);
    if(mine&&!localOnly){myPin=mine;showMine(mine);}
    $("#modeNote").textContent=m.size+" élő";
    rebuild();
  },err=>{clearTimeout(timer);$("#modeNote").textContent="Offline";db=null;});
})();
})();
</script>
