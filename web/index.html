<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TribeMap</title>
<meta name="description" content="An anonymous world map of football fans: pin where you cheer from and who for.">
<meta name="theme-color" content="#16181c">
<meta name="google-site-verification" content="V-NjAuUIO05qEwSjQBTvjEofk1jSgQX21TddNAMNrNs">
<meta property="og:title" content="TribeMap">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tribemap.web.app/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<script>
/* theme before first paint, so there is no flash */
(()=>{let t;try{t=localStorage.getItem("tm.theme");}catch(_){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";const d=document.documentElement;d.dataset.theme=t;d.classList.toggle("is-dark",t==="dark");})();
</script>
<script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="map" data-i18n-attr="aria-label:mapLabel"></div>

<section class="board" aria-label="TribeMap">
  <header class="board-head">
    <div class="logo">tribemap<i>.</i></div>
    <button class="acct-btn" id="acctBtn" data-i18n-attr="aria-label:account"><span class="avatar anon" id="acctBtnAvatar">?</span></button>
  </header>
  <div class="stats">
    <div><b id="sFans">–</b><span data-i18n="fans"></span></div>
    <div><b id="sTeams">–</b><span data-i18n="teamsLabel"></span></div>
  </div>
  <div class="board-body" id="boardBody">
    <div class="seg seg3" role="group" data-i18n-attr="aria-label:viewGroup">
      <button id="vPins" aria-pressed="true" data-i18n="viewPins"></button>
      <button id="vHeat" aria-pressed="false" data-i18n="viewHeat"></button>
      <button id="vTribes" aria-pressed="false" data-i18n="viewTribes"></button>
    </div>
    <div class="tribes-box" id="tribesBox" hidden>
      <button class="chipbtn newtribe" id="newTribeBtn" data-i18n="newTribe"></button>
      <ul class="teams" id="tribeList"></ul>
    </div>
    <div class="area">
      <div class="seg seg4" role="group" id="areaSeg" data-i18n-attr="aria-label:areaLabel">
        <button data-area="world" aria-pressed="true" data-i18n="areaWorld"></button>
        <button data-area="country" aria-pressed="false" data-i18n="areaCountry"></button>
        <button data-area="city" aria-pressed="false" data-i18n="areaCity"></button>
        <button data-area="radius" aria-pressed="false" data-i18n="areaRadius"></button>
      </div>
      <div class="combo" id="areaSearchBox" hidden>
        <input class="field sm" id="areaInput" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="areaOpts">
        <ul id="areaOpts" role="listbox" hidden></ul>
      </div>
      <div class="radius" id="radiusBox" hidden>
        <div class="hint" id="radiusHint" data-i18n="radiusHint"></div>
        <div class="range"><input type="range" id="radiusRange" min="1" max="200" value="25" data-i18n-attr="aria-label:areaRadius"><b id="radiusVal">25 km</b></div>
      </div>
    </div>
    <div id="filterBox"></div>
    <input class="field sm" id="teamSearch" type="search" autocomplete="off" data-i18n-attr="placeholder:teamSearch;aria-label:teamSearch">
    <div class="hint" id="teamHint" hidden></div>
    <ul class="teams" id="teamList"></ul>
    <button class="textbtn more" id="moreTeams" hidden></button>
    <div class="foot">
      <label class="switch"><input type="checkbox" id="demoToggle" checked> <span data-i18n="demo"></span></label>
      <button class="privacy" id="privacyBtn" data-i18n="privacy"></button>
    </div>
  </div>
  <button class="grab" id="boardGrab" aria-expanded="true" aria-controls="boardBody" data-i18n-attr="aria-label:panelToggle"><span></span></button>
</section>

<!-- account: who I am, my pin, language, theme. Top-right on desktop, bottom sheet on phones. -->
<section class="account" id="account" data-i18n-attr="aria-label:account">
  <div class="acct-head">
    <span class="avatar anon" id="acctAvatar">?</span>
    <div class="acct-who"><b id="acctName"></b><span id="acctSub"></span></div>
    <button class="x acct-close" id="acctClose" data-i18n-attr="aria-label:close">✕</button>
  </div>

  <div class="acct-out" id="acctOut">
    <button class="save sm" id="acctLoginBtn" data-i18n="signIn"></button>
    <div class="authbox" id="acctLogin" hidden>
      <button class="gbtn js-google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3a7.2 7.2 0 0 1-10.7-3.8H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1A7.2 7.2 0 0 1 12 4.8z"/></svg><span data-i18n="google"></span></button>
      <div class="or" data-i18n="or"></div>
      <form class="emailrow js-email"><input class="field" type="email" required autocomplete="email" data-i18n-attr="placeholder:emailPh;aria-label:emailPh"><button class="chipbtn" data-i18n="sendLink"></button></form>
    </div>
  </div>

  <div class="acct-in" id="acctIn" hidden>
    <div class="uname" id="unameView" hidden><span>@<b id="unameText"></b></span><button class="textbtn" id="unameEdit" data-i18n="change"></button></div>
    <button class="textbtn uname-add" id="unameAdd" hidden data-i18n="setUsername"></button>
    <form class="uname-form" id="unameForm" hidden>
      <div class="label" data-i18n="usernameOpt"></div>
      <div class="uname-row"><input class="field sm" id="unameInput" maxlength="20" autocomplete="username" spellcheck="false" data-i18n-attr="placeholder:nickPh;aria-label:usernameOpt"><button class="chipbtn" data-i18n="saveChanges"></button></div>
    </form>
    <div class="mypin" id="myPinBox" hidden>
      <span class="dot" id="mpDot"></span>
      <div><b id="mpTeam"></b><span id="mpSub"></span></div>
    </div>
    <div class="acct-actions" id="myPinActs" hidden>
      <button class="primary" id="mpShow" data-i18n="showPin"></button>
      <button id="mpEdit" data-i18n="editPin"></button>
      <button id="mpDel" data-i18n="deletePinShort"></button>
    </div>
    <div class="nopin" id="noPinBox" hidden><span data-i18n="noPin"></span><button class="chipbtn" id="mpAdd" data-i18n="cta"></button></div>
  </div>

  <div class="status" id="acctStatus" role="status"></div>

  <div class="acct-tools">
    <div class="flags" role="group" data-i18n-attr="aria-label:language">
      <button class="flag" data-lang="hu" aria-label="Magyar" title="Magyar"><svg viewBox="0 0 6 6" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="6" height="2" fill="#CD2A3E"/><rect y="2" width="6" height="2" fill="#fff"/><rect y="4" width="6" height="2" fill="#436F4D"/></svg></button>
      <button class="flag" data-lang="en" aria-label="English" title="English"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="gbS"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="gbT"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#gbS)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#gbT)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
      <button class="flag" data-lang="es" aria-label="Español" title="Español"><svg viewBox="0 0 6 6" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="6" height="6" fill="#AA151B"/><rect y="1.5" width="6" height="3" fill="#F1BF00"/></svg></button>
    </div>
    <div class="acct-tools-r">
      <button class="textbtn" id="signOutBtn" hidden data-i18n="signOut"></button>
      <button class="themebtn" id="themeBtn" data-i18n-attr="aria-label:themeToggle"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </div>
  </div>
</section>

<button class="cta" id="openSheet" data-i18n="cta"></button>

<!-- data-clarity-mask: session recordings must never show where someone places their pin -->
<aside class="sheet" id="sheet" hidden data-clarity-mask="true" data-i18n-attr="aria-label:sheetLabel">
  <div class="sheet-head"><h2 id="sheetTitle" data-i18n="sheetTitle"></h2><button class="x" id="closeSheet" data-i18n-attr="aria-label:close">✕</button></div>
  <div class="step" id="st1">
    <div class="label" data-i18n="stepTeam"></div>
    <div class="combo">
      <input class="field" id="teamInput" data-i18n-attr="placeholder:teamPlaceholder" autocomplete="off" maxlength="40" role="combobox" aria-expanded="false" aria-controls="teamOpts">
      <ul id="teamOpts" role="listbox" hidden></ul>
    </div>
  </div>
  <div class="step" id="st2">
    <div class="label" data-i18n="stepPlace"></div>
    <div class="loc">
      <button class="chipbtn" id="pickBtn" data-i18n="onMap"></button>
      <div class="combo">
        <input class="field" id="cityInput" data-i18n-attr="placeholder:searchCity;aria-label:city" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="cityOpts">
        <ul id="cityOpts" role="listbox" hidden></ul>
      </div>
    </div>
    <div class="combo" id="addrBox" hidden>
      <input class="field" id="addrInput" data-i18n-attr="placeholder:addrPlaceholder;aria-label:addrPlaceholder" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="addrOpts">
      <ul id="addrOpts" role="listbox" hidden></ul>
    </div>
    <div class="picked" id="pickedBox"></div>
  </div>
  <div class="step" id="st3">
    <div class="label" data-i18n="stepPrec"></div>
    <div class="prec" role="radiogroup" data-i18n-attr="aria-label:stepPrec">
      <label><input type="radio" name="prec" value="area" checked><b data-i18n="precArea"></b></label>
      <label><input type="radio" name="prec" value="city"><b data-i18n="precCity"></b></label>
      <label><input type="radio" name="prec" value="exact"><b data-i18n="precExact"></b></label>
    </div>
    <div class="hint" id="precHint" data-i18n="hintArea"></div>
  </div>
  <div class="actions">
    <button class="save" id="saveBtn" disabled data-i18n="save"></button>
    <div class="authbox" id="authBox" hidden>
      <p data-i18n="authTitle"></p>
      <button class="gbtn js-google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3a7.2 7.2 0 0 1-10.7-3.8H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1A7.2 7.2 0 0 1 12 4.8z"/></svg><span data-i18n="google"></span></button>
      <div class="or" data-i18n="or"></div>
      <form class="emailrow js-email"><input class="field" type="email" required autocomplete="email" data-i18n-attr="placeholder:emailPh;aria-label:emailPh"><button class="chipbtn" data-i18n="sendLink"></button></form>
    </div>
    <div id="myRow" hidden class="myrow"><button class="textbtn" id="delBtn" data-i18n="deletePin"></button></div>
    <div class="status" id="status" role="status"></div>
  </div>
</aside>

<!-- tribe: city + team community with a feed. Composer inputs are masked from session recordings. -->
<aside class="sheet tribe-sheet" id="tribeSheet" hidden data-i18n-attr="aria-label:tribe">
  <div class="sheet-head">
    <div class="tribe-head"><span class="dot" id="tsDot"></span><div><h2 id="tsTitle"></h2><div class="tribe-sub" id="tsSub"></div></div></div>
    <button class="x" id="tsClose" data-i18n-attr="aria-label:close">✕</button>
  </div>

  <div class="tribe-create" id="tsCreate" hidden>
    <div class="step"><div class="label" data-i18n="stepTeam"></div><div class="field ro" id="tcTeam"></div></div>
    <div class="step">
      <div class="label" data-i18n="areaCity"></div>
      <div class="combo">
        <input class="field" id="tcCity" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="tcCityOpts" data-i18n-attr="placeholder:searchCity;aria-label:areaCity">
        <ul id="tcCityOpts" role="listbox" hidden></ul>
      </div>
    </div>
    <button class="save" id="tcSave" disabled data-i18n="createTribe"></button>
  </div>

  <div class="tribe-actions" id="tsActions">
    <button class="save sm" id="tsJoin" data-i18n="join"></button>
    <button class="textbtn" id="tsShare" data-i18n="inviteLink"></button>
    <button class="textbtn" id="tsLeave" hidden data-i18n="leave"></button>
  </div>

  <div class="gate" id="tsGate" hidden><p id="tsGateText"></p><button class="chipbtn" id="tsGateBtn"></button></div>

  <form class="nickbox" id="tsNick" hidden data-clarity-mask="true">
    <div class="label" data-i18n="nickTitle"></div>
    <input class="field" id="nickInput" maxlength="24" autocomplete="nickname" data-i18n-attr="placeholder:nickPh;aria-label:nickTitle">
    <ul class="rules"><li data-i18n="rule1"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li><li data-i18n="rule4"></li></ul>
    <label class="check"><input type="checkbox" id="rulesOk"> <span data-i18n="rulesAccept"></span></label>
    <button class="save" id="nickSave" data-i18n="nickSave"></button>
  </form>

  <form class="composer" id="tsComposer" hidden data-clarity-mask="true">
    <textarea class="field" id="postText" maxlength="500" rows="2" data-i18n-attr="placeholder:postPh;aria-label:postPh"></textarea>
    <button class="chipbtn" data-i18n="send"></button>
  </form>
  <div class="status" id="tsStatus" role="status"></div>
  <ul class="feed" id="tsFeed"></ul>
</aside>

<div class="pickhint" id="pickHint" hidden data-i18n="pickHint"></div>

<div class="consent" id="consent" hidden role="dialog" aria-live="polite">
  <p data-i18n="consentText"></p>
  <div class="consent-actions"><button class="no" id="consentNo" data-i18n="consentReject"></button><button class="yes" id="consentYes" data-i18n="consentAccept"></button></div>
</div>
</body>
</html>
