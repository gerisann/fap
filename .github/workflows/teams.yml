name: Teams from API-Football

# Monthly (and on demand): club leagues + national teams -> web/src/data/teams-api.js (~65 requests, paced
# for the free plan's per-minute limit), then the club crests that are still missing (no key, no quota) ->
# web/public/logos/. The app picks both up on the next hosting deploy. "crests_only" skips the API list.
on:
  schedule:
    - cron: "40 5 1 * *"
  workflow_dispatch:
    inputs:
      crests_only:
        description: "Only fetch missing crests (no API-Football requests)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fixtures
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch teams
        if: ${{ !inputs.crests_only }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-teams.mjs
      - name: Fetch crests
        run: |
          command -v convert || command -v magick || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)
          node scripts/fetch-logos.mjs
          node scripts/fetch-flags.mjs
      - name: Commit if changed
        run: |
          git config user.name "tribemap-bot"
          git config user.email "tribemap-bot@users.noreply.github.com"
          git add web/src/data/teams-api.js web/src/data/logos.js web/src/data/crest-colors.js web/public/logos web/public/flags
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Teams from API-Football $(date -u +%F)"
          # GitHub sometimes answers a push with a 500: try a few times, rebasing in between
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; echo "push failed ($i), retrying"; sleep 15; done; exit 1
